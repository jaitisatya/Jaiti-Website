<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaiti Foundation | Daily Drive Update | Admin Panel</title>
    <meta name="description" content="Admin panel for approving users and managing submissions">
    <link rel="icon" type="image/webp" href="images/logo.webp" sizes="32x32">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f8f8;
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #2c1a0e;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-role {
            padding: 4px 12px;
            background: #fef3c7;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #92400e;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #f0ebe3;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #3a7260;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #e8e2da;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .page-header h1 {
            font-size: 28px;
            font-family: 'Playfair Display', serif;
            color: #2c1a0e;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #7a6b5d;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: #f0ebe3;
            cursor: pointer;
            font-weight: 600;
            color: #7a6b5d;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            background: white;
            color: #3a7260;
            border-bottom-color: #3a7260;
        }

        .tab-btn:hover {
            background: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-name {
            font-weight: 600;
            color: #2c1a0e;
        }

        .user-email {
            font-size: 13px;
            color: #7a6b5d;
        }

        .user-date {
            font-size: 12px;
            color: #a08878;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-approve {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-approve:hover {
            background: #059669;
        }

        .btn-reject {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-reject:hover {
            background: #dc2626;
        }

        .btn-remove {
            padding: 8px 16px;
            background: #9ca3af;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-label {
            font-size: 12px;
            color: #7a6b5d;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #3a7260;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7a6b5d;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .submission-summary {
            background: #f0fdf4;
            border: 1px solid #10b981;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #047857;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 90px;
            }

            .card-header {
                flex-direction: column;
                gap: 15px;
            }

            .action-buttons {
                width: 100%;
                gap: 8px;
            }

            .btn-approve, .btn-reject, .btn-remove {
                flex: 1;
            }

            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">Admin Panel - Daily Drive Update</div>
    <div class="header-actions">
        <div class="user-role">👤 Admin</div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1>Admin Control Center</h1>
        <p>Manage user approvals and view submission analytics</p>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Pending Approvals</div>
            <div class="stat-value" id="pendingCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Approved Users</div>
            <div class="stat-value" id="approvedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Submissions</div>
            <div class="stat-value" id="totalSubmissions">0</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('pending')">⏳ Pending Approvals</button>
        <button class="tab-btn" onclick="showTab('approved')">✓ Approved Users</button>
        <button class="tab-btn" onclick="showTab('submissions')">📋 All Submissions</button>
    </div>

    <!-- Pending Approvals Tab -->
    <div id="pending" class="tab-content active">
        <div id="pendingList"></div>
    </div>

    <!-- Approved Users Tab -->
    <div id="approved" class="tab-content">
        <div id="approvedList"></div>
    </div>

    <!-- Submissions Tab -->
    <div id="submissions" class="tab-content">
        <div id="submissionsList"></div>
    </div>
</div>

<script>
    function initializeAdmin() {
        const userEmail = localStorage.getItem('userEmail');
        const userRole = localStorage.getItem('userRole');

        if (!userEmail || userRole !== 'admin') {
            window.location.href = 'login.html';
            return;
        }

        loadAdminData();
    }

    function loadAdminData() {
        // Sample pending users
        const pendingUsers = [
            {
                name: 'John Doe',
                email: 'john@jaiti.in',
                phone: '9876543210',
                signupDate: '2026-05-20',
                organization: 'Jaiti School Branch A'
            },
            {
                name: 'Sarah Kumar',
                email: 'sarah@jaiti.in',
                phone: '9876543211',
                signupDate: '2026-05-21',
                organization: 'Jaiti School Branch B'
            }
        ];

        // Sample approved users
        const approvedUsers = [
            {
                name: 'Demo User',
                email: 'demo@jaiti.in',
                phone: '9876543212',
                approvalDate: '2026-05-15',
                organization: 'Jaiti Foundation',
                submissions: 5
            },
            {
                name: 'Priya Singh',
                email: 'priya@jaiti.in',
                phone: '9876543213',
                approvalDate: '2026-05-10',
                organization: 'Jaiti School Branch C',
                submissions: 8
            }
        ];

        // Sample submissions
        const submissions = [
            {
                date: '2026-05-21',
                submitter: 'demo@jaiti.in',
                children: 25,
                activities: 'Math lesson, Drawing, Games',
                status: 'Approved'
            },
            {
                date: '2026-05-20',
                submitter: 'demo@jaiti.in',
                children: 30,
                activities: 'Science experiment, Discussion',
                status: 'Approved'
            }
        ];

        renderPendingUsers(pendingUsers);
        renderApprovedUsers(approvedUsers);
        renderSubmissions(submissions);
        updateStats(pendingUsers, approvedUsers, submissions);
    }

    function renderPendingUsers(users) {
        const container = document.getElementById('pendingList');
        if (users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>No pending approvals</p></div>';
            return;
        }

        container.innerHTML = users.map((user, index) => `
            <div class="card">
                <div class="card-header">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-date">📞 ${user.phone} • 🏢 ${user.organization}</div>
                        <div class="user-date" style="margin-top: 5px;">Signup: ${user.signupDate}</div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-approve" onclick="approveUser('${user.email}', ${index})">✓ Approve</button>
                        <button class="btn-reject" onclick="rejectUser('${user.email}', ${index})">✗ Reject</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderApprovedUsers(users) {
        const container = document.getElementById('approvedList');
        if (users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No approved users</p></div>';
            return;
        }

        container.innerHTML = users.map((user, index) => `
            <div class="card">
                <div class="card-header">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-date">📞 ${user.phone} • 🏢 ${user.organization}</div>
                        <div class="user-date" style="margin-top: 5px;">Approved: ${user.approvalDate} • Submissions: <strong>${user.submissions}</strong></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-remove" onclick="removeUser('${user.email}', ${index})">🗑️ Remove Access</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderSubmissions(submissions) {
        const container = document.getElementById('submissionsList');
        if (submissions.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No submissions</p></div>';
            return;
        }

        let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse;">';
        html += '<thead><tr style="background: #f0ebe3; border-bottom: 2px solid #d4c9bc;">';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Date</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Submitter</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Children</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Activities</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Status</th>';
        html += '</tr></thead><tbody>';

        submissions.forEach(sub => {
            html += '<tr style="border-bottom: 1px solid #e0e0e0;">';
            html += `<td style="padding: 15px;">${sub.date}</td>`;
            html += `<td style="padding: 15px;">${sub.submitter}</td>`;
            html += `<td style="padding: 15px; font-weight: 600;">${sub.children}</td>`;
            html += `<td style="padding: 15px;">${sub.activities}</td>`;
            html += `<td style="padding: 15px;"><span class="badge badge-approved">${sub.status}</span></td>`;
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    function updateStats(pendingUsers, approvedUsers, submissions) {
        document.getElementById('pendingCount').textContent = pendingUsers.length;
        document.getElementById('approvedCount').textContent = approvedUsers.length;
        document.getElementById('totalSubmissions').textContent = submissions.length;
    }

    function showTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // Show selected tab
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    function approveUser(email, index) {
        alert(`User ${email} has been approved!`);
        // In real implementation, this would call Google Apps Script
    }

    function rejectUser(email, index) {
        alert(`User ${email} has been rejected!`);
        // In real implementation, this would call Google Apps Script
    }

    function removeUser(email, index) {
        if (confirm(`Remove access for ${email}?`)) {
            alert(`Access removed for ${email}`);
            // In real implementation, this would call Google Apps Script
        }
    }

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userRole');
        localStorage.removeItem('userStatus');
        window.location.href = 'login.html';
    }

    initializeAdmin();
</script>

</body>
</html>
