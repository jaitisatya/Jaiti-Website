<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaiti Foundation | Daily Drive Update | Admin Panel</title>
    <meta name="description" content="Admin panel for approving users and managing submissions">
    <link rel="icon" type="image/webp" href="images/logo.webp" sizes="32x32">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f8f8;
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #2c1a0e;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-role {
            padding: 4px 12px;
            background: #fef3c7;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #92400e;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #f0ebe3;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #3a7260;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #e8e2da;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .page-header h1 {
            font-size: 28px;
            font-family: 'Playfair Display', serif;
            color: #2c1a0e;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #7a6b5d;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: #f0ebe3;
            cursor: pointer;
            font-weight: 600;
            color: #7a6b5d;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            background: white;
            color: #3a7260;
            border-bottom-color: #3a7260;
        }

        .tab-btn:hover {
            background: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-name {
            font-weight: 600;
            color: #2c1a0e;
        }

        .user-email {
            font-size: 13px;
            color: #7a6b5d;
        }

        .user-date {
            font-size: 12px;
            color: #a08878;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-approve {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-approve:hover {
            background: #059669;
        }

        .btn-reject {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-reject:hover {
            background: #dc2626;
        }

        .btn-remove {
            padding: 8px 16px;
            background: #9ca3af;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-label {
            font-size: 12px;
            color: #7a6b5d;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #3a7260;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7a6b5d;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .submission-summary {
            background: #f0fdf4;
            border: 1px solid #10b981;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #047857;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: #2c1a0e;
            margin-bottom: 20px;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #7a6b5d;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #2c1a0e;
        }

        .form-group-modal {
            margin-bottom: 15px;
        }

        .form-group-modal label {
            display: block;
            margin-bottom: 5px;
            color: #2c1a0e;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group-modal input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d4c9bc;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .form-group-modal input:focus {
            outline: none;
            border-color: #3a7260;
            box-shadow: 0 0 0 3px rgba(58, 114, 96, 0.1);
        }

        .modal-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #7f1d1d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .modal-error.show {
            display: block;
        }

        .modal-success {
            background: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .modal-success.show {
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save {
            flex: 1;
            padding: 10px;
            background: #3a7260;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            background: #2f5f4f;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background: #f0ebe3;
            color: #7a6b5d;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #e8e2da;
        }

        .btn-change-password {
            padding: 8px 16px;
            background: #dd6c4a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-change-password:hover {
            background: #c45535;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 90px;
            }

            .card-header {
                flex-direction: column;
                gap: 15px;
            }

            .action-buttons {
                width: 100%;
                gap: 8px;
            }

            .btn-approve, .btn-reject, .btn-remove {
                flex: 1;
            }

            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">Admin Panel - Daily Drive Update</div>
    <div class="header-actions">
        <div class="user-role">👤 Admin</div>
        <button class="btn-change-password" onclick="openPasswordModal()">🔐 Change Password</button>
        <button class="btn-change-password" onclick="resetAllData()" style="background: #ef4444;">🔄 Reset Data</button>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1>Admin Control Center</h1>
        <p>Manage user approvals and view submission analytics</p>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Pending Approvals</div>
            <div class="stat-value" id="pendingCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Approved Users</div>
            <div class="stat-value" id="approvedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Submissions</div>
            <div class="stat-value" id="totalSubmissions">0</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('pending')">⏳ Pending Approvals</button>
        <button class="tab-btn" onclick="showTab('approved')">✓ Approved Users</button>
        <button class="tab-btn" onclick="showTab('submissions')">📋 All Submissions</button>
    </div>

    <!-- Pending Approvals Tab -->
    <div id="pending" class="tab-content active">
        <div id="pendingList"></div>
    </div>

    <!-- Approved Users Tab -->
    <div id="approved" class="tab-content">
        <div id="approvedList"></div>
    </div>

    <!-- Submissions Tab -->
    <div id="submissions" class="tab-content">
        <div id="submissionsList"></div>
    </div>
</div>

<!-- Password Change Modal -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePasswordModal()">&times;</span>
        <div class="modal-header">🔐 Change Password</div>
        
        <div class="modal-error" id="passwordError"></div>
        <div class="modal-success" id="passwordSuccess">✓ Password changed successfully!</div>
        
        <form id="changePasswordForm" onsubmit="handlePasswordChange(event)">
            <div class="form-group-modal">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required placeholder="Enter current password">
            </div>
            
            <div class="form-group-modal">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required placeholder="Enter new password (min 8 characters)">
            </div>
            
            <div class="form-group-modal">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required placeholder="Confirm new password">
            </div>
            
            <div class="modal-buttons">
                <button type="submit" class="btn-save">✓ Save Password</button>
                <button type="button" class="btn-cancel" onclick="closePasswordModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    function initializeAdmin() {
        const userEmail = localStorage.getItem('userEmail');
        const userRole = localStorage.getItem('userRole');

        if (!userEmail || userRole !== 'admin') {
            window.location.href = 'login.html';
            return;
        }

        loadAdminData();
    }

    function loadAdminData() {
        // Load pending users from localStorage
        const pendingUsers = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
        
        // Load approved users from localStorage
        let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers') || '[]');
        
        // If no approved users, add demo user
        if (approvedUsers.length === 0) {
            approvedUsers = [
                {
                    name: 'Demo User',
                    email: 'demo@jaiti.in',
                    phone: '9876543212',
                    approvalDate: '2026-05-15',
                    organization: 'Jaiti Foundation',
                    submissions: 5
                },
                {
                    name: 'Priya Singh',
                    email: 'priya@jaiti.in',
                    phone: '9876543213',
                    approvalDate: '2026-05-10',
                    organization: 'Jaiti School Branch C',
                    submissions: 8
                }
            ];
            localStorage.setItem('approvedUsers', JSON.stringify(approvedUsers));
        }

        // Sample submissions
        const submissions = [
            {
                date: '2026-05-21',
                submitter: 'demo@jaiti.in',
                children: 25,
                activities: 'Math lesson, Drawing, Games',
                status: 'Approved'
            },
            {
                date: '2026-05-20',
                submitter: 'demo@jaiti.in',
                children: 30,
                activities: 'Science experiment, Discussion',
                status: 'Approved'
            }
        ];

        renderPendingUsers(pendingUsers);
        renderApprovedUsers(approvedUsers);
        renderSubmissions(submissions);
        updateStats(pendingUsers, approvedUsers, submissions);
    }

    function renderPendingUsers(users) {
        const container = document.getElementById('pendingList');
        if (users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>No pending approvals</p></div>';
            return;
        }

        container.innerHTML = users.map((user, index) => `
            <div class="card">
                <div class="card-header">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-date">📞 ${user.phone} • 🏢 ${user.organization}</div>
                        <div class="user-date" style="margin-top: 5px;">Signup: ${user.signupDate}</div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-approve" onclick="approveUser('${user.email}', ${index})">✓ Approve</button>
                        <button class="btn-reject" onclick="rejectUser('${user.email}', ${index})">✗ Reject</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderApprovedUsers(users) {
        const container = document.getElementById('approvedList');
        if (users.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No approved users</p></div>';
            return;
        }

        container.innerHTML = users.map((user, index) => `
            <div class="card">
                <div class="card-header">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-date">📞 ${user.phone} • 🏢 ${user.organization}</div>
                        <div class="user-date" style="margin-top: 5px;">Approved: ${user.approvalDate} • Submissions: <strong>${user.submissions}</strong></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-remove" onclick="removeUser('${user.email}', ${index})">🗑️ Remove Access</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderSubmissions(submissions) {
        const container = document.getElementById('submissionsList');
        if (submissions.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No submissions</p></div>';
            return;
        }

        let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse;">';
        html += '<thead><tr style="background: #f0ebe3; border-bottom: 2px solid #d4c9bc;">';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Date</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Submitter</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Children</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Activities</th>';
        html += '<th style="padding: 15px; text-align: left; font-weight: 600; color: #2c1a0e;">Status</th>';
        html += '</tr></thead><tbody>';

        submissions.forEach(sub => {
            html += '<tr style="border-bottom: 1px solid #e0e0e0;">';
            html += `<td style="padding: 15px;">${sub.date}</td>`;
            html += `<td style="padding: 15px;">${sub.submitter}</td>`;
            html += `<td style="padding: 15px; font-weight: 600;">${sub.children}</td>`;
            html += `<td style="padding: 15px;">${sub.activities}</td>`;
            html += `<td style="padding: 15px;"><span class="badge badge-approved">${sub.status}</span></td>`;
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    function updateStats(pendingUsers, approvedUsers, submissions) {
        document.getElementById('pendingCount').textContent = pendingUsers.length;
        document.getElementById('approvedCount').textContent = approvedUsers.length;
        document.getElementById('totalSubmissions').textContent = submissions.length;
    }

    function showTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // Show selected tab
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    function approveUser(email, index) {
        // Move from pending to approved
        const pendingUsers = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
        let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers') || '[]');
        
        const userToApprove = pendingUsers.find(u => u.email === email);
        if (userToApprove) {
            userToApprove.approvalDate = new Date().toISOString().split('T')[0];
            userToApprove.submissions = 0;
            
            approvedUsers.push(userToApprove);
            const updatedPending = pendingUsers.filter(u => u.email !== email);
            
            localStorage.setItem('pendingUsers', JSON.stringify(updatedPending));
            localStorage.setItem('approvedUsers', JSON.stringify(approvedUsers));
            
            alert(`✓ User ${email} has been approved!`);
            location.reload();
        }
    }

    function rejectUser(email, index) {
        const pendingUsers = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
        const updatedPending = pendingUsers.filter(u => u.email !== email);
        localStorage.setItem('pendingUsers', JSON.stringify(updatedPending));
        
        alert(`✗ User ${email} has been rejected!`);
        location.reload();
    }

    function removeUser(email, index) {
        if (confirm(`Remove access for ${email}?`)) {
            let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers') || '[]');
            const updatedApproved = approvedUsers.filter(u => u.email !== email);
            localStorage.setItem('approvedUsers', JSON.stringify(updatedApproved));
            
            alert(`✗ Access removed for ${email}`);
            location.reload();
        }
    }

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userRole');
        localStorage.removeItem('userStatus');
        window.location.href = 'login.html';
    }

    // Password Change Functions
    function openPasswordModal() {
        document.getElementById('passwordModal').classList.add('show');
        document.getElementById('passwordError').classList.remove('show');
        document.getElementById('passwordSuccess').classList.remove('show');
        document.getElementById('changePasswordForm').reset();
    }

    function closePasswordModal() {
        document.getElementById('passwordModal').classList.remove('show');
        document.getElementById('changePasswordForm').reset();
    }

    function handlePasswordChange(event) {
        event.preventDefault();
        
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorEl = document.getElementById('passwordError');
        const successEl = document.getElementById('passwordSuccess');
        
        // Clear previous messages
        errorEl.classList.remove('show');
        successEl.classList.remove('show');
        
        // Validation
        const storedAdminPassword = localStorage.getItem('adminPassword') || 'admin1234';
        
        if (currentPassword !== storedAdminPassword) {
            errorEl.textContent = '❌ Current password is incorrect';
            errorEl.classList.add('show');
            return;
        }
        
        if (newPassword.length < 8) {
            errorEl.textContent = '❌ New password must be at least 8 characters';
            errorEl.classList.add('show');
            return;
        }
        
        if (newPassword !== confirmPassword) {
            errorEl.textContent = '❌ Passwords do not match';
            errorEl.classList.add('show');
            return;
        }
        
        // Save new password
        localStorage.setItem('adminPassword', newPassword);
        successEl.classList.add('show');
        
        // Clear form and close after 2 seconds
        setTimeout(() => {
            closePasswordModal();
        }, 2000);
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('passwordModal');
        if (event.target == modal) {
            closePasswordModal();
        }
    }

    // Reset All Data Function
    function resetAllData() {
        if (confirm('⚠️ Are you sure? This will delete ALL pending users, approved users, and submissions!\n\nThis action cannot be undone.')) {
            if (confirm('🔴 Final confirmation: Delete all data?')) {
                localStorage.removeItem('pendingUsers');
                localStorage.removeItem('approvedUsers');
                alert('✓ All data has been reset! Page will refresh now.');
                location.reload();
            }
        }
    }

    initializeAdmin();
</script>

</body>
</html>
