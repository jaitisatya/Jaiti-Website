<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaiti Foundation | Daily Drive Update | Check-in Form</title>
    <meta name="description" content="Submit daily teaching session data for Jaiti Foundation">
    <link rel="icon" type="image/webp" href="images/logo.webp" sizes="32x32">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f8f8;
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #2c1a0e;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info {
            font-size: 13px;
            color: #7a6b5d;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #f0ebe3;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #3a7260;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #e8e2da;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-header h1 {
            font-size: 28px;
            font-family: 'Playfair Display', serif;
            color: #2c1a0e;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #7a6b5d;
            font-size: 14px;
        }

        .status-alert {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .status-alert.show {
            display: block;
        }

        .status-alert.error {
            background: #fee2e2;
            border-left-color: #ef4444;
            color: #7f1d1d;
        }

        .status-alert.success {
            background: #d1fae5;
            border-left-color: #10b981;
            color: #065f46;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c1a0e;
            font-weight: 600;
            font-size: 14px;
        }

        .required {
            color: #ef4444;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4c9bc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3a7260;
            box-shadow: 0 0 0 3px rgba(58, 114, 96, 0.1);
        }

        input:disabled {
            background: #f8f8f8;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .photo-upload {
            border: 2px dashed #d4c9bc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .photo-upload:hover {
            border-color: #3a7260;
            background: #f0f9f8;
        }

        .photo-upload.drag-over {
            border-color: #3a7260;
            background: #f0f9f8;
        }

        .photo-upload input {
            display: none;
        }

        .photo-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .photo-text {
            color: #7a6b5d;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .photo-subtext {
            color: #a08878;
            font-size: 12px;
        }

        .photo-preview {
            margin-top: 15px;
            display: none;
        }

        .photo-preview.show {
            display: block;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .photo-info {
            background: #f0fdf4;
            border: 1px solid #10b981;
            color: #047857;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2f5f4f 0%, #3a7260 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(58, 114, 96, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-text {
            color: #ef4444;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 90px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-header, .form-container {
                padding: 20px;
            }

            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">Daily Drive Update</div>
    <div class="header-actions">
        <div class="user-info">
            <span id="userName">User</span> •
            <span id="userEmail" style="font-size: 12px; color: #a08878;">email@jaiti.in</span>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">
    <div class="form-header">
        <h1>Daily Check-in Form</h1>
        <p>Record your daily teaching session details</p>
        <div class="status-alert" id="statusAlert"></div>
    </div>

    <div class="form-container">
        <form id="driveUpdateForm">
            <!-- Row 1: Date and Submitter Email -->
            <div class="form-row">
                <div class="form-group">
                    <label for="dateInput">Date <span class="required">*</span></label>
                    <input type="date" id="dateInput" required disabled>
                </div>
                <div class="form-group">
                    <label for="emailInput">Submitter Email <span class="required">*</span></label>
                    <input type="email" id="emailInput" required disabled>
                </div>
            </div>

            <!-- Row 2: Children Count and Classes -->
            <div class="form-row">
                <div class="form-group">
                    <label for="childrenCount">No. of Children Taught <span class="required">*</span></label>
                    <input type="number" id="childrenCount" min="0" required placeholder="e.g., 25">
                    <div class="error-text" id="childrenCountError"></div>
                </div>
                <div class="form-group">
                    <label for="classesCount">No. of Classes <span class="required">*</span></label>
                    <input type="number" id="classesCount" min="0" required placeholder="e.g., 3">
                    <div class="error-text" id="classesCountError"></div>
                </div>
            </div>

            <!-- Row 3: Teachers and Timing -->
            <div class="form-row">
                <div class="form-group">
                    <label for="teachersInput">No. of Teachers & Names <span class="required">*</span></label>
                    <input type="text" id="teachersInput" required placeholder="e.g., Rahul, Priya, Amit">
                    <div class="error-text" id="teachersInputError"></div>
                </div>
                <div class="form-group">
                    <label for="timingInput">Timing <span class="required">*</span></label>
                    <input type="text" id="timingInput" required placeholder="e.g., 5:00 PM - 7:00 PM">
                    <div class="error-text" id="timingInputError"></div>
                </div>
            </div>

            <!-- Activities -->
            <div class="form-group">
                <label for="activitiesInput">Activities <span class="required">*</span></label>
                <textarea id="activitiesInput" required placeholder="e.g., Math lesson, Drawing, Games, Discussion"></textarea>
                <div class="error-text" id="activitiesInputError"></div>
            </div>

            <!-- Row 4: Visitor Count -->
            <div class="form-group">
                <label for="visitorCount">Visitor Count</label>
                <input type="number" id="visitorCount" min="0" placeholder="0">
            </div>

            <!-- Row 5: Visitor Names and Contact -->
            <div class="form-row">
                <div class="form-group">
                    <label for="visitorNames">Visitor Names</label>
                    <input type="text" id="visitorNames" placeholder="e.g., John, Sarah, Mike">
                </div>
                <div class="form-group">
                    <label for="visitorContact">Visitor Contact</label>
                    <input type="text" id="visitorContact" placeholder="e.g., john@email.com, 9876543210">
                </div>
            </div>

            <!-- Photo Upload -->
            <div class="form-group">
                <label>Photo <span class="required">*</span></label>
                <div class="photo-upload" id="photoUpload">
                    <div class="photo-icon">📷</div>
                    <div class="photo-text">Click to upload or drag & drop</div>
                    <div class="photo-subtext">PNG, JPG, WebP (Max 5MB before compression)</div>
                    <input type="file" id="photoInput" accept="image/*" required>
                </div>
                <div class="photo-preview" id="photoPreview">
                    <img class="preview-img" id="previewImg" alt="Preview">
                    <div class="photo-info" id="photoInfo"></div>
                </div>
                <div class="error-text" id="photoError"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Daily Drive Update</button>
        </form>
    </div>
</div>

<script>
    // Initialize on page load
    function initializeForm() {
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');
        const userStatus = localStorage.getItem('userStatus');

        if (!userEmail) {
            window.location.href = 'login.html';
            return;
        }

        if (userStatus !== 'approved') {
            showAlert('Your account is not yet approved by admin. Please wait for approval.', 'error');
            return;
        }

        document.getElementById('userEmail').textContent = userEmail;
        document.getElementById('userName').textContent = userName || 'User';
        document.getElementById('emailInput').value = userEmail;

        // Auto-fill date with today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').value = today;

        // Check if already submitted today
        checkDailySubmission(today);
    }

    function checkDailySubmission(date) {
        // Check if user has already submitted today
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/d/YOUR_SCRIPT_ID/usercallback';
        const userEmail = localStorage.getItem('userEmail');
        
        fetch(APPS_SCRIPT_URL + '?action=checkDailySubmission', {
            method: 'POST',
            body: JSON.stringify({
                email: userEmail,
                date: date
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.hasSubmitted) {
                document.getElementById('submitBtn').textContent = 'Update Submission';
                showAlert('You have already submitted today. You can update your submission until midnight.', 'info');
            }
        })
        .catch(error => console.error('Error checking submission:', error));
    }

    // Photo upload handling
    const photoUpload = document.getElementById('photoUpload');
    const photoInput = document.getElementById('photoInput');

    photoUpload.addEventListener('click', () => photoInput.click());

    photoUpload.addEventListener('dragover', (e) => {
        e.preventDefault();
        photoUpload.classList.add('drag-over');
    });

    photoUpload.addEventListener('dragleave', () => {
        photoUpload.classList.remove('drag-over');
    });

    photoUpload.addEventListener('drop', (e) => {
        e.preventDefault();
        photoUpload.classList.remove('drag-over');
        if (e.dataTransfer.files.length) {
            photoInput.files = e.dataTransfer.files;
            handlePhotoSelect();
        }
    });

    photoInput.addEventListener('change', handlePhotoSelect);

    function handlePhotoSelect() {
        const file = photoInput.files[0];
        if (!file) return;

        // Show file size
        const originalSize = (file.size / 1024).toFixed(2);
        document.getElementById('photoInfo').textContent = `Original: ${originalSize} KB`;

        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('photoPreview').classList.add('show');

            // Compress image
            compressImage(file);
        };
        reader.readAsDataURL(file);
    }

    function compressImage(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                // Resize if too large
                const maxWidth = 1200;
                const maxHeight = 800;
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width *= ratio;
                    height *= ratio;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Compress with quality
                let quality = 0.8;
                let compressedSize = 0;
                let attempts = 0;

                const compressWithQuality = () => {
                    canvas.toBlob((blob) => {
                        compressedSize = blob.size;
                        const compressedSizeKB = (compressedSize / 1024).toFixed(2);

                        if (compressedSize > 102400 && quality > 0.3 && attempts < 3) {
                            quality -= 0.2;
                            attempts++;
                            compressWithQuality();
                        } else {
                            document.getElementById('photoInfo').innerHTML = 
                                `Original: ${(file.size / 1024).toFixed(2)} KB → Compressed: ${compressedSizeKB} KB ✓`;
                            
                            if (compressedSize > 102400) {
                                document.getElementById('photoError').textContent = 'Photo is still too large after compression. Please use a smaller image.';
                                document.getElementById('photoError').classList.add('show');
                            } else {
                                document.getElementById('photoError').classList.remove('show');
                                // Store compressed blob
                                const compressedFile = new File([blob], 'photo.webp', { type: 'image/webp' });
                                photoInput.files = new DataTransfer().items;
                                const dt = new DataTransfer();
                                dt.items.add(compressedFile);
                                photoInput.files = dt.files;
                            }
                        }
                    }, 'image/webp', quality);
                };

                compressWithQuality();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Form submission
    document.getElementById('driveUpdateForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/d/YOUR_SCRIPT_ID/usercallback';

        // Validation
        let isValid = true;
        const childrenCount = document.getElementById('childrenCount').value;
        const classesCount = document.getElementById('classesCount').value;
        const teachers = document.getElementById('teachersInput').value;
        const timing = document.getElementById('timingInput').value;
        const activities = document.getElementById('activitiesInput').value;
        const photoInput = document.getElementById('photoInput');

        if (!childrenCount || childrenCount < 0) {
            showFieldError('childrenCountError', 'Please enter number of children');
            isValid = false;
        }
        if (!classesCount || classesCount < 0) {
            showFieldError('classesCountError', 'Please enter number of classes');
            isValid = false;
        }
        if (!teachers.trim()) {
            showFieldError('teachersInputError', 'Please enter teacher names');
            isValid = false;
        }
        if (!timing.trim()) {
            showFieldError('timingInputError', 'Please enter timing');
            isValid = false;
        }
        if (!activities.trim()) {
            showFieldError('activitiesInputError', 'Please enter activities');
            isValid = false;
        }
        if (!photoInput.files.length) {
            showAlert('Please upload a photo', 'error');
            isValid = false;
        }

        if (!isValid) return;

        // Disable button and show loading state
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        // Prepare form data
        const formData = new FormData();
        formData.append('action', 'submitForm');
        formData.append('data', JSON.stringify({
            date: document.getElementById('dateInput').value,
            email: document.getElementById('emailInput').value,
            childrenCount: parseInt(childrenCount),
            classesCount: parseInt(classesCount),
            teachers: teachers,
            timing: timing,
            activities: activities,
            visitorCount: document.getElementById('visitorCount').value || 0,
            visitorNames: document.getElementById('visitorNames').value || '',
            visitorContact: document.getElementById('visitorContact').value || ''
        }));
        formData.append('photo', photoInput.files[0]);

        // Submit to Google Apps Script
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';

            if (data.success) {
                showAlert('Form submitted successfully! Your data has been saved.', 'success');
                document.getElementById('driveUpdateForm').reset();
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('dateInput').value = today;
                submitBtn.textContent = 'Update Submission';
            } else {
                showAlert(data.message || 'Submission failed. Please try again.', 'error');
            }
        })
        .catch(error => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';
            showAlert('Network error. Please try again.', 'error');
            console.error('Submission error:', error);
        });
    });

    function showFieldError(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.classList.add('show');
    }

    function clearFieldError(elementId) {
        document.getElementById(elementId).classList.remove('show');
    }

    function showAlert(message, type = 'info') {
        const alert = document.getElementById('statusAlert');
        alert.textContent = (type === 'success' ? '✓ ' : '⚠ ') + message;
        alert.className = `status-alert show ${type}`;
    }

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userStatus');
        window.location.href = 'login.html';
    }

    // Initialize
    initializeForm();

    // Clear error on focus
    document.querySelectorAll('input, textarea').forEach(el => {
        el.addEventListener('focus', function() {
            const errorId = this.id + 'Error';
            if (document.getElementById(errorId)) {
                clearFieldError(errorId);
            }
        });
    });
</script>

</body>
</html>
